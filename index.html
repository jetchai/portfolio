<title>翟玉泰作品集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版型：左側一條製程時間軸（年份刻度），右側依時期展開作品；桌面版左欄有固定的年份讀數 */
:root {
  --paper: #eef1ef;
  --surface: #ffffff;
  --ink: #16201c;
  --muted: #5a6762;
  --line: #c8d1cc;
  --accent: #1d6a59;
  --accent-soft: #d9ebe5;
  --signal: #b8621b;
  --signal-soft: #f6e6d6;
  --shadow: 0 1px 2px rgba(22, 32, 28, .06), 0 8px 24px rgba(22, 32, 28, .06);
  --f-display: "Bricolage Grotesque", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111715; --surface: #19211e; --ink: #e5ebe8; --muted: #92a19b; --line: #2b3632;
    --accent: #63c3a9; --accent-soft: #1d3530; --signal: #f0a457; --signal-soft: #3a2a1b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111715; --surface: #19211e; --ink: #e5ebe8; --muted: #92a19b; --line: #2b3632;
  --accent: #63c3a9; --accent-soft: #1d3530; --signal: #f0a457; --signal-soft: #3a2a1b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; }

/* 頁首 */
header.top { padding-block: 56px 32px; display: grid; gap: 28px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 7vw, 72px); line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .en { display: block; font-size: .32em; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 10px; }
.tagline { font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; margin: 0; text-wrap: balance; }
.intro { max-width: 62ch; color: var(--muted); margin: 0; }
.contact { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--f-mono); font-size: 14px; }
.contact .addr { user-select: all; }
.btn {
  font: inherit; font-family: var(--f-body); font-size: 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 18px 16px 16px 0; display: grid; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 16px; }
.stat b { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat b small { font-family: var(--f-body); font-size: 14px; font-weight: 500; margin-left: 3px; color: var(--muted); }
.stat span { font-size: 13px; color: var(--muted); }

.draft { margin-top: 8px; padding: 10px 14px; border-radius: 8px; background: var(--signal-soft); color: var(--ink); font-size: 14px; border: 1px dashed var(--signal); }

/* 篩選 */
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.chip { flex: none; font: inherit; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 5px 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 12px; opacity: .7; margin-left: 4px; }

/* 時間軸 */
.layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 32px; padding-block: 32px 80px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); align-self: start; display: grid; gap: 4px; }
.rail .now { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--signal); transition: opacity .2s; }
.rail .to { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.rail .org { font-weight: 700; font-size: 15px; margin-top: 6px; }
.rail .scale { margin-top: 20px; display: grid; gap: 2px; }
.rail .scale button { all: unset; cursor: pointer; font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.rail .scale button::before { content: ""; width: 14px; height: 1px; background: var(--line); transition: width .2s, background .2s; }
.rail .scale button.on { color: var(--ink); }
.rail .scale button.on::before { width: 28px; background: var(--signal); }
.rail .scale button:focus-visible { outline: 2px solid var(--accent); }

.timeline { position: relative; display: grid; gap: 56px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 10px); }

.era { position: relative; padding-left: 40px; display: grid; gap: 20px; scroll-margin-top: 80px; }
.era::before { content: ""; position: absolute; left: 0; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 3px solid var(--signal); }
.era-head { display: grid; gap: 4px; }
.era-years { font-family: var(--f-mono); font-size: 14px; color: var(--signal); font-weight: 500; font-variant-numeric: tabular-nums; }
.era-head h2 { margin: 0; font-family: var(--f-display); font-size: clamp(24px, 3.4vw, 32px); line-height: 1.2; text-wrap: balance; }
.era-role { color: var(--muted); font-size: 15px; }
.era-summary { margin: 4px 0 0; max-width: 66ch; }
.era-note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

.items { display: grid; gap: 16px; }
.item { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 22px 24px; display: grid; gap: 12px; position: relative; }
.item::before { content: ""; position: absolute; left: -36px; top: 30px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.item-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.item h3 { margin: 0; font-size: 20px; line-height: 1.35; flex: 1 1 260px; text-wrap: balance; }
.item .y { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.flag { background: var(--signal-soft); color: var(--signal); }
.problem { margin: 0; color: var(--muted); }
.problem b { color: var(--ink); font-weight: 500; }
.did { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.take { margin: 0; font-weight: 700; border-left: 3px solid var(--accent); padding-left: 12px; }
.tech { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.media.one { grid-template-columns: minmax(0, 1fr); max-width: 640px; }
.m { margin: 0; display: grid; gap: 6px; min-width: 0; }
.m video, .m img { width: 100%; max-width: 100%; display: block; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
.m video { aspect-ratio: 16 / 10; object-fit: contain; background: #0b0f0d; }
.m .thumb { all: unset; cursor: zoom-in; display: block; border-radius: 8px; }
.m .thumb img { aspect-ratio: 4 / 3; object-fit: cover; }
.media.one .m .thumb img { aspect-ratio: auto; object-fit: contain; max-height: 520px; background: var(--surface); }
.m figcaption { font-size: 13px; color: var(--muted); line-height: 1.5; }

.empty-era { color: var(--muted); font-size: 14px; }
.none { padding: 40px 0; color: var(--muted); }

footer { border-top: 1px solid var(--line); padding-block: 24px 48px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* 燈箱 */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 10, .92); display: grid; grid-template-rows: 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 48px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.lb img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; border-radius: 6px; min-height: 0; }
.lb .cap { color: #dfe7e3; text-align: center; font-size: 14px; padding-top: 12px; }
.lb .x, .lb .nav { position: absolute; border: 0; cursor: pointer; background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; width: 44px; height: 44px; font-size: 20px; }
.lb .x { top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(16px, env(safe-area-inset-right, 0px)); }
.lb .prev { left: max(16px, env(safe-area-inset-left, 0px)); top: 50%; }
.lb .next { right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 60; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; padding-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .era { padding-left: 28px; }
  .item { padding: 18px 16px; }
  .item::before { left: -24px; }
  .timeline::before { left: 7px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <nav class="filters" id="filters" aria-label="依類別篩選"></nav>
  <div class="layout">
    <aside class="rail" id="rail" aria-label="時間軸"></aside>
    <main class="timeline" id="timeline"></main>
  </div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script>
(function () {
  const P = window.PORTFOLIO;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const catLabel = Object.fromEntries(P.categories.map((c) => [c.id, c.label]));

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // 頁首
  const p = P.person;
  $("#top").innerHTML = `
    <div class="eyebrow">Portfolio · 2011 — ${new Date().getFullYear()}</div>
    <h1>${esc(p.name)}<span class="en">${esc(p.nameEn)}</span></h1>
    <p class="tagline">${esc(p.tagline)}</p>
    <p class="intro">${esc(p.intro)}</p>
    <div class="contact">
      <span class="addr" id="email">${esc(p.email)}</span>
      <button class="btn" id="copy" type="button">複製信箱</button>
      <a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>
    </div>
    <div class="stats">${p.stats.map((s) => `<div class="stat"><b>${esc(s.value)}<small>${esc(s.unit)}</small></b><span>${esc(s.label)}</span></div>`).join("")}</div>
    ${P.DRAFT ? `<div class="draft">草稿版：標示「待確認」的項目還需要本人確認；沒有圖片或影片的作品，素材陸續補上。</div>` : ""}
  `;
  $("#copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(p.email);
      toast("已複製信箱");
    } catch (e) {
      const r = document.createRange(); r.selectNodeContents($("#email"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("已選取信箱，請按 Ctrl+C 複製");
    }
  });

  // 篩選
  let filter = "all";
  try { filter = localStorage.getItem("pf-filter") || "all"; } catch (e) {}
  if (filter !== "all" && !catLabel[filter]) filter = "all";
  const allItems = P.eras.flatMap((e) => e.items);
  const count = (id) => id === "all" ? allItems.length : allItems.filter((i) => i.cats.includes(id)).length;
  function renderFilters() {
    const chips = [{ id: "all", label: "全部" }, ...P.categories];
    $("#filters").innerHTML = chips.map((c) =>
      `<button class="chip" type="button" data-f="${c.id}" aria-pressed="${filter === c.id}">${esc(c.label)}<span class="n">${count(c.id)}</span></button>`).join("");
  }
  $("#filters").addEventListener("click", (ev) => {
    const b = ev.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f;
    try { localStorage.setItem("pf-filter", filter); } catch (e) {}
    renderFilters(); renderTimeline();
    toast(filter === "all" ? "顯示全部作品" : `只顯示「${catLabel[filter]}」：${count(filter)} 件`);
  });

  // 媒體
  const gallery = [];
  function mediaHtml(media) {
    if (!media.length) return "";
    const cls = media.length === 1 ? "media one" : "media";
    return `<div class="${cls}">${media.map((m) => {
      if (m.type === "video") {
        return `<figure class="m"><video controls muted playsinline preload="none" poster="${esc(m.poster)}" src="${esc(m.src)}"></video><figcaption>${esc(m.caption)}</figcaption></figure>`;
      }
      const idx = gallery.push(m) - 1;
      return `<figure class="m"><button class="thumb" type="button" data-g="${idx}" aria-label="放大：${esc(m.caption)}"><img loading="lazy" src="${esc(m.src)}" alt="${esc(m.caption)}"></button><figcaption>${esc(m.caption)}</figcaption></figure>`;
    }).join("")}</div>`;
  }

  function itemHtml(it) {
    const flags = [];
    if (P.DRAFT && it.draft) flags.push(`<span class="tag flag">待確認：${esc(it.draft)}</span>`);
    if (P.DRAFT && !it.media.length) flags.push(`<span class="tag flag">待補素材</span>`);
    return `<article class="item">
      <div class="item-top"><h3>${esc(it.title)}</h3><span class="y">${esc(it.year)}</span></div>
      <div class="tags">${it.cats.map((c) => `<span class="tag">${esc(catLabel[c])}</span>`).join("")}${flags.join("")}</div>
      ${it.problem ? `<p class="problem"><b>問題　</b>${esc(it.problem)}</p>` : ""}
      ${it.did.length ? `<ul class="did">${it.did.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
      ${it.takeaway ? `<p class="take">${esc(it.takeaway)}</p>` : ""}
      ${mediaHtml(it.media)}
      ${it.tech.length ? `<div class="tech">${it.tech.map(esc).join(" · ")}</div>` : ""}
    </article>`;
  }

  const yearsText = (e) => e.end === "now" ? `${e.start} — 至今` : (e.end && e.end !== e.start ? `${e.start} — ${e.end}` : e.start);

  function renderTimeline() {
    gallery.length = 0;
    const eras = P.eras.map((e) => ({ ...e, shown: filter === "all" ? e.items : e.items.filter((i) => i.cats.includes(filter)) }))
      .filter((e) => filter === "all" || e.shown.length);
    $("#timeline").innerHTML = eras.length ? eras.map((e) => `
      <section class="era" id="era-${e.id}" data-era="${e.id}">
        <div class="era-head">
          <div class="era-years">${esc(yearsText(e))}</div>
          <h2>${esc(e.org)}</h2>
          <div class="era-role">${esc(e.role)}</div>
          <p class="era-summary">${esc(e.summary)}</p>
          ${e.note ? `<div class="era-note">${esc(e.note)}</div>` : ""}
        </div>
        ${e.shown.length ? `<div class="items">${e.shown.map(itemHtml).join("")}</div>` : ""}
      </section>`).join("") : `<p class="none">這個類別目前沒有作品。</p>`;
    renderRail(eras);
  }

  // 左側年份讀數
  let observer;
  function renderRail(eras) {
    const rail = $("#rail");
    if (!eras.length) { rail.innerHTML = ""; return; }
    rail.innerHTML = `<div class="now" id="rnow"></div><div class="to" id="rto"></div><div class="org" id="rorg"></div>
      <div class="scale">${eras.map((e) => `<button type="button" data-go="${e.id}">${esc(e.start)} ${esc(e.org)}</button>`).join("")}</div>`;
    const set = (id) => {
      const e = eras.find((x) => x.id === id); if (!e) return;
      $("#rnow").textContent = e.start;
      $("#rto").textContent = e.end === "now" ? "→ 至今" : (e.end && e.end !== e.start ? `→ ${e.end}` : "");
      $("#rorg").textContent = e.org;
      rail.querySelectorAll("[data-go]").forEach((b) => b.classList.toggle("on", b.dataset.go === id));
    };
    set(eras[0].id);
    if (observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      const vis = entries.filter((en) => en.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis.length) set(vis[0].target.dataset.era);
    }, { rootMargin: "-30% 0px -60% 0px" });
    document.querySelectorAll(".era").forEach((el) => observer.observe(el));
  }
  $("#rail").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-go]"); if (!b) return;
    const el = document.getElementById("era-" + b.dataset.go);
    if (el) { el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); toast(`跳到 ${b.textContent}`); }
  });

  // 燈箱
  let lb, cur = 0;
  function openLb(i) {
    cur = i;
    if (!lb) {
      lb = document.createElement("div");
      lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
      lb.innerHTML = `<img alt=""><div class="cap"></div><button class="x" type="button" aria-label="關閉">✕</button><button class="nav prev" type="button" aria-label="上一張">‹</button><button class="nav next" type="button" aria-label="下一張">›</button>`;
      lb.addEventListener("click", (ev) => {
        if (ev.target.classList.contains("prev")) step(-1);
        else if (ev.target.classList.contains("next")) step(1);
        else if (ev.target.classList.contains("x") || ev.target === lb) closeLb();
      });
      document.body.appendChild(lb);
    }
    lb.hidden = false; showLb(); $(".x", lb).focus();
  }
  function showLb() { const m = gallery[cur]; $("img", lb).src = m.src; $("img", lb).alt = m.caption; $(".cap", lb).textContent = `${m.caption}（${cur + 1}／${gallery.length}）`; }
  function step(d) { cur = (cur + d + gallery.length) % gallery.length; showLb(); }
  function closeLb() { lb.hidden = true; }
  document.addEventListener("keydown", (ev) => {
    if (!lb || lb.hidden) return;
    if (ev.key === "Escape") closeLb();
    if (ev.key === "ArrowLeft") step(-1);
    if (ev.key === "ArrowRight") step(1);
  });
  $("#timeline").addEventListener("click", (ev) => { const b = ev.target.closest("[data-g]"); if (b) openLb(+b.dataset.g); });

  $("#foot").innerHTML = `<span>${esc(p.name)}　${esc(p.nameEn)}</span><span>最後更新 2026-11-17</span>`;

  renderFilters();
  renderTimeline();
})();
</script>
